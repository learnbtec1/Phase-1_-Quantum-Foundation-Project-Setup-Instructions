services:
  db:
    image: postgres:16-alpine
    container_name: nexus_db
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "5432:5432"
    volumes:
      - ./backend/data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    container_name: nexus_backend
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql+psycopg2://nexus:nexus@db:5432/nexus
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"
      # Azure Speech SDK (libMicrosoft.CognitiveServices.Speech.core.so) needs CA certs
      # to initialise its HTTP singleton — prevents "Error 27" at startup.
      SSL_CERT_FILE: "/etc/ssl/certs/ca-certificates.crt"
      SSL_CERT_DIR: "/etc/ssl/certs"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - whisper_model_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; u='http://127.0.0.1:8000/api/health'; req=urllib.request.Request(u, method='GET'); urllib.request.urlopen(req, timeout=3); sys.exit(0)"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: dev-base
    container_name: nexus_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0", "-p", "3000"]
    environment:
      # NEXT_PUBLIC_* vars are browser-visible — use the HOST-mapped port (localhost:8000),
      # NOT the internal Docker service name (backend:8000) which browsers cannot resolve.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_AGENT_WS: ws://localhost:8000/ws/agent
      # Server-side only (no NEXT_PUBLIC prefix) — resolved inside Docker network.
      # These MUST use the Docker service name "backend", NOT 127.0.0.1 (which would
      # resolve to the frontend container itself and cause a 503 on every proxy call).
      BACKEND_URL: http://backend:8000
      TTS_BACKEND_URL: http://backend:8000/api/v1/tts-with-timing
      CHAT_BACKEND_URL: http://backend:8000/api/v1/chat
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').request('http://127.0.0.1:3000/api/health',{method:'HEAD'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1)).end()"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  whisper_model_cache:
    driver: local