services:
  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  db:
    image: postgres:16-alpine
    container_name: nexus_db
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "5432:5432"
    volumes:
      - ./backend/data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    container_name: nexus_backend
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql+psycopg2://nexus:nexus@db:5432/nexus
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production_docker}
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"
      SSL_CERT_FILE: "/etc/ssl/certs/ca-certificates.crt"
      SSL_CERT_DIR: "/etc/ssl/certs"
      TTS_ARABIC_VOICE: "ar-JO-TaimNeural"
      COGNI_ARABIC_TTS_VOICE_LOCKED: "ar-JO-TaimNeural"
      # Allow edge-tts / gTTS when Azure fails (401 auth, rate limits, etc.)
      TTS_DISABLE_NON_AZURE_FALLBACK: "false"
      # BTEC textbook / rubric / exemplar corpus (host path mounted read-only below)
      LOCAL_RAG_ENABLED: "true"
      LOCAL_RAG_DIR: "/app/btec_corpus"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/data/btec-bus:/app/btec_corpus:ro
      - whisper_model_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; u='http://127.0.0.1:8000/api/health'; req=urllib.request.Request(u, method='GET'); urllib.request.urlopen(req, timeout=3); sys.exit(0)"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: dev-base
    container_name: nexus_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0", "-p", "3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_AGENT_WS: ws://localhost:8000/ws/agent
      BACKEND_URL: http://backend:8000
      TTS_BACKEND_URL: http://backend:8000/api/v1/tts-with-timing
      TTS_PROXY_TIMEOUT_MS: "90000"
      CHAT_BACKEND_URL: http://backend:8000/api/v1/chat
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').request('http://127.0.0.1:3000/api/health',{method:'HEAD'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1)).end()"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  whisper_model_cache:
    driver: local