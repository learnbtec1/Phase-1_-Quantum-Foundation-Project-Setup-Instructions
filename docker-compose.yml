services:
  redis:
    image: redis:7-alpine
    container_name: eduverse_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  db:
    image: postgres:16-alpine
    container_name: eduverse_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduverse}
      POSTGRES_USER: ${POSTGRES_USER:-eduverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduverse}
    ports:
      - "5432:5432"
    # tmpfs: avoids chmod/initdb failures when Docker stores volumes on NTFS (e.g. disk image on E:)
    # or bind mounts from /mnt/... under WSL. Data is lost on `docker compose down` (container removed).
    # For a persistent DB on Linux/ext4 or default Docker Desktop WSL2 disk, use:
    #   docker compose -f docker-compose.yml -f docker-compose.db-persistent.yml up
    tmpfs:
      - /var/lib/postgresql/data:rw,size=2147483648
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    container_name: eduverse_backend
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      # Use same credentials as db service (override via root .env: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB)
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-eduverse}:${POSTGRES_PASSWORD:-eduverse}@db:5432/${POSTGRES_DB:-eduverse}
      REDIS_URL: redis://redis:6379/0
      # Required in .env — compose fails fast if unset (avoids shipping a known-weak default).
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in project root .env — see backend/.env.example}
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"
      SSL_CERT_FILE: "/etc/ssl/certs/ca-certificates.crt"
      SSL_CERT_DIR: "/etc/ssl/certs"
      TTS_ARABIC_VOICE: "ar-JO-TaimNeural"
      COGNI_ARABIC_TTS_VOICE_LOCKED: "ar-JO-TaimNeural"
      # Allow edge-tts / gTTS when Azure fails (401 auth, rate limits, etc.)
      TTS_DISABLE_NON_AZURE_FALLBACK: "false"
      # BTEC textbook / rubric / exemplar corpus (host path mounted read-only below)
      LOCAL_RAG_ENABLED: "true"
      LOCAL_RAG_DIR: "/app/btec_corpus"
      # تقييمات دائمة مع Postgres في Docker (انظر README)
      USE_DB: "true"
      # عند تشغيل خدمة chromadb (profile: chroma) وجّه العميل عبر CHROMA_SERVER_* إن دعم الكود ذلك؛
      # الافتراضي: Chroma محلي داخل الحاوية تحت /app/data/chroma_cogni
      # CHROMA_HOST: chromadb
      # CHROMA_PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      # Chroma persistence at /app/data/chroma_cogni — keep across restarts (no full RAG rebuild)
      - ./backend/data:/app/data
      # BTEC corpus files (LOCAL_RAG_DIR=/app/btec_corpus)
      - ./backend/data/btec-bus:/app/btec_corpus:ro
      - whisper_model_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; u='http://127.0.0.1:8000/api/health'; req=urllib.request.Request(u, method='GET'); urllib.request.urlopen(req, timeout=3); sys.exit(0)"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: dev-base
    container_name: eduverse_frontend
    working_dir: /app
    # Set PROJECT_ROOT in `.env` to this repo’s absolute host path (e.g. D:\work\ukd or /mnt/d/work/ukd) when WSL/cross-drive bind mounts miss edits.
    volumes:
      - ${PROJECT_ROOT:-.}/frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0", "-p", "3000"]
    environment:
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_AGENT_WS: ws://localhost:8000/ws/agent
      BACKEND_URL: http://backend:8000
      TTS_BACKEND_URL: http://backend:8000/api/v1/tts-with-timing
      TTS_PROXY_TIMEOUT_MS: "90000"
      CHAT_BACKEND_URL: http://backend:8000/api/v1/chat
      # Enable gesture/lip-sync simulation when Azure TTS key is absent.
      # Set to "false" (or remove) once AZURE_SPEECH_KEY is provided.
      NEXT_PUBLIC_MIME_MODE: "true"
      NEXT_PUBLIC_AVATAR_VRM_URL: "/models/cogni.vrm"
      # Scene: DEFAULT (carpet + desk) | OFFICE — must be set for Next dev server / client bundle
      NEXT_PUBLIC_ACTIVE_ENV: ${NEXT_PUBLIC_ACTIVE_ENV:-DEFAULT}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').request('http://127.0.0.1:3000/api/health',{method:'HEAD'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1)).end()"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ChromaDB كخادم منفصل (اختياري). تشغيل: docker compose --profile chroma up -d chromadb
  # ثم اضبط متغيرات الاتصال في backend إذا كان التطبيق يستخدم HttpClient بدل المسار المحلي.
  chromadb:
    profiles: ["chroma"]
    image: chromadb/chroma:latest
    container_name: eduverse_chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
    restart: unless-stopped

  # One-shot BTEC → ChromaDB (same volumes as backend). Run: docker compose --profile ingest run --rm btec-ingest
  btec-ingest:
    profiles: ["ingest"]
    build: ./backend
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      # Same paths as backend: Chroma DB + read-only BTEC files
      - ./backend/data:/app/data
      - ./backend/data/btec-bus:/app/btec_corpus:ro
    command: ["python", "scripts/btec_ingest.py", "--data-dir", "/app/btec_corpus", "--chroma-dir", "/app/data/chroma_cogni"]

volumes:
  whisper_model_cache:
    driver: local
  chromadb_data:
    driver: local
