# Stack: app + pgvector (Postgres) + Redis. Postgres data uses a *named* Docker volume so it
# persists across `docker compose down` / restarts. Do NOT use `docker compose down -v` in
# production — that flag removes named volumes and wipes the database.
# (No top-level `version:` key — obsolete in Compose V2; engine infers schema.)

services:
  # stock postgres:15 does not ship pgvector — extension install fails, vector(…) queries break
  db:
    image: pgvector/pgvector:pg15
    container_name: eduvor-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${EDUVOR_DB_PORT}:5432"
    volumes:
      # Named volume: survives container removal (no tmpfs; data on host Docker area)
      - postgres_data:/var/lib/postgresql/data

  # Logical dumps to named volume; runs daily via repo-root scripts/pg_backup.sh (not backend/scripts/).
  # Bind mount + `sh /pg_backup.sh` avoids missing +x on Windows hosts. Keep script UTF-8 LF (see .gitattributes).
  db-backup:
    image: postgres:15-alpine
    container_name: eduvor-db-backup
    restart: always
    depends_on:
      - db
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      BACKUP_RETAIN: "7"
      BACKUP_INTERVAL_SEC: "86400"
    volumes:
      - backups_data:/backups
      - ./scripts/pg_backup.sh:/pg_backup.sh:ro
      - ./scripts/pg_backup_entry.sh:/pg_backup_entry.sh:ro
    # Run entry (CRLF-tolerant) not raw script — see scripts/pg_backup_entry.sh.
    # Must be ONE sh + script path. Using command ["/bin/sh", "/pg_backup.sh"] *after*
    # entrypoint ["/bin/sh"] would run: sh /bin/sh /pg_backup.sh → sh tries to *source*
    # the real /bin/sh binary as a script → "ELF: not found" and garbage line errors.
    entrypoint: ["/bin/sh", "/pg_backup_entry.sh"]

  # For backend: set REDIS_URL=redis://redis:6379/0 (or /1) in backend/.env — A/B metrics + rate limits
  redis:
    image: redis:7-alpine
    container_name: eduvor-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: eduvor-backend
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    env_file:
      - ./backend/.env
    # Override: inside this network, `localhost` is the API container, not Redis.
    # Use the Compose service name (same as the `redis:` service key below).
    environment:
      REDIS_URL: redis://redis:6379/0
      # Documented parity — Edge synthesis voice is locked in ``tts_service.EDGE_TTS_VOICE_LOCKED_GLOBAL``.
      EDGE_TTS_VOICE: ar-SA-ZariyahNeural
      TTS_ARABIC_VOICE: ar-SA-ZariyahNeural
    ports:
      - "${EDUVOR_API_PORT}:8000"   # 🔥 أهم سطر
    volumes:
      - backups_data:/backups
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
        # Dev emergency: inlined at Docker build — set "false" and rebuild before any non-local/public image push.
        NEXT_PUBLIC_EMERGENCY_AUTH_FREEZE: "true"
        # Baked into the client bundle at build time — must match host-mapped API port (see root .env EDUVOR_API_PORT).
        # Single-file dev: run `docker compose --env-file ./frontend/.env build --no-cache frontend` so substitution matches `./frontend/.env`.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8001}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8001/ws/agent}
        NEXT_PUBLIC_USE_AVATAR: ${NEXT_PUBLIC_USE_AVATAR:-false}
        NEXT_PUBLIC_TTS_PROVIDER: ${NEXT_PUBLIC_TTS_PROVIDER:-edge}
        NEXT_PUBLIC_USE_WS_AGENT_AUDIO: ${NEXT_PUBLIC_USE_WS_AGENT_AUDIO:-false}
        NEXT_PUBLIC_DEBUG_TTS: ${NEXT_PUBLIC_DEBUG_TTS:-false}
        NEXT_PUBLIC_DEBUG_FORCE_WEB_SPEECH_TTS: ${NEXT_PUBLIC_DEBUG_FORCE_WEB_SPEECH_TTS:-false}
        NEXT_PUBLIC_AUTH_DEV_INJECT: ${NEXT_PUBLIC_AUTH_DEV_INJECT:-}
        NEXT_PUBLIC_DEV_TOKEN: ${NEXT_PUBLIC_DEV_TOKEN:-}
        NEXT_PUBLIC_DEV_AUTH_TOKEN: ${NEXT_PUBLIC_DEV_AUTH_TOKEN:-}
        NEXT_PUBLIC_AUTH_DEV_REDIRECT: ${NEXT_PUBLIC_AUTH_DEV_REDIRECT:-}
    container_name: eduvor-frontend
    restart: always
    environment:
      # Backend FastAPI exposes POST /api/v1/tts-with-timing (Edge neural synthesis when TTS_PROVIDER=edge).
      BACKEND_INTERNAL_URL: http://backend:8000
    env_file:
      - ./frontend/.env
    ports:
      - "${EDUVOR_UI_PORT}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    # Explicit default driver (local) — data persists on the Docker host
    driver: local
  # pg_dump output (*.sql) — persists across `docker compose down` (not removed with `-v` unless you drop this volume)
  backups_data:
    driver: local