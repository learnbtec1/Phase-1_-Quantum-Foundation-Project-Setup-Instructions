# PHASE 14 — Core data plane (db/redis) and backend use restart: always so the stack
# recovers after daemon or node reboot. Backend waits for healthy db + redis before start.
services:
  redis:
    image: redis:7-alpine
    container_name: eduverse_redis
    # Host 6380 → container 6379: avoids clash when another Redis (e.g. eduvor-redis) already binds :6379.
    # Backend keeps redis://redis:6379 inside the Compose network.
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  db:
    image: postgres:16-alpine
    container_name: eduverse_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduverse}
      POSTGRES_USER: ${POSTGRES_USER:-eduverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduverse}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Self-hosted Piper TTS — two instances for horizontal scale (round-robin from backend).
  # `local_tts` is a network alias for this container so backends can use http://local_tts:8080/synthesize.
  local_tts_1:
    build: ./local_tts
    container_name: eduverse_local_tts_1
    ports:
      - "8081:8080"
    restart: unless-stopped
    environment:
      # 1.0 = neutral Piper output (no ffmpeg pitch shift — avoids metallic / distorted timbre).
      - PIPER_POST_PITCH_MULT=${PIPER_POST_PITCH_MULT:-1.0}
      - PIPER_POST_EQ=${PIPER_POST_EQ:-false}
    networks:
      default:
        aliases:
          - local_tts

  local_tts_2:
    build: ./local_tts
    container_name: eduverse_local_tts_2
    ports:
      - "8082:8080"
    restart: unless-stopped
    environment:
      - PIPER_POST_PITCH_MULT=${PIPER_POST_PITCH_MULT:-1.0}
      - PIPER_POST_EQ=${PIPER_POST_EQ:-false}

  backend:
    build: ./backend
    container_name: eduverse_backend
    # Apply migrations before uvicorn — register/login require `users.hashed_password` etc.
    # Set SKIP_ALEMBIC=1 on the backend service only to skip (debug).
    command:
      [
        "/bin/sh",
        "-c",
        'if [ -z "$${SKIP_ALEMBIC}" ]; then alembic upgrade head; fi && exec uvicorn app.main:app --host 0.0.0.0 --port 8000',
      ]
    # Shared memory for faster-whisper / onnxruntime (avoids mmap issues under load).
    shm_size: "1g"
    # PHASE 18 — inject voice + JWT explicitly (compose interpolation reads project `.env`; no env_file on backend).
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ANONYMIZED_TELEMETRY=False
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-eduverse}:${POSTGRES_PASSWORD:-eduverse}@db:5432/${POSTGRES_DB:-eduverse}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - JWT_ALGORITHM=HS256
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # LLM + embeddings: set in project `.env` (same file compose reads for interpolation).
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PYTHONIOENCODING=utf-8
      - PYTHONUTF8=1
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - SSL_CERT_DIR=/etc/ssl/certs
      # Edge fallback voice (male JO neural). Piper microservice ignores this; uses kareem ONNX in image.
      - TTS_ARABIC_VOICE=${TTS_ARABIC_VOICE:-ar-JO-TaimNeural}
      - COGNI_ARABIC_TTS_VOICE_LOCKED=${COGNI_ARABIC_TTS_VOICE_LOCKED:-ar-JO-TaimNeural}
      - TTS_FORCE_JORDANIAN=${TTS_FORCE_JORDANIAN:-true}
      - TTS_AZURE_ONLY=false
      - TTS_DISABLE_NON_AZURE_FALLBACK=true
      - TTS_PROVIDER=${TTS_PROVIDER:-local}
      - EDGE_TTS_VOICE=${EDGE_TTS_VOICE:-ar-JO-TaimNeural}
      # Local Piper: primary URL uses service alias `local_tts` → local_tts_1 (see networks.aliases).
      - LOCAL_TTS_URLS=${LOCAL_TTS_URLS:-http://local_tts:8080/synthesize,http://local_tts_2:8080/synthesize}
      - LOCAL_TTS_URL=${LOCAL_TTS_URL:-http://local_tts:8080/synthesize}
      # Default chain is Piper-only; set TTS_FALLBACK_CHAIN in `.env` to add edge/elevenlabs when keys exist.
      - TTS_FALLBACK_CHAIN=${TTS_FALLBACK_CHAIN:-local_piper}
      - LOCAL_TTS_TIMEOUT=${LOCAL_TTS_TIMEOUT:-30}
      # Bust stale TTS cache when switching Piper / voice (v2 cache key includes this tag).
      - TTS_CACHE_MODEL_TAG=${TTS_CACHE_MODEL_TAG:-piper_ar_jo_kareem}
      - COGNI_WS_ALLOW_ANONYMOUS=true
      - COGNI_DEV_BYPASS_AUTH=true
      - LOCAL_RAG_ENABLED=true
      - LOCAL_RAG_DIR=/app/btec_corpus
      - USE_DB=true
      - WHISPER_MODEL_PRIORITY=tiny,base,small
      - HF_HOME=/root/.cache/huggingface

    # Publish API + WebSocket to host (browser uses 127.0.0.1:8000, not Docker service name).
    ports:
      - "0.0.0.0:8000:8000"

    volumes:
      - chroma_cogni_data:/app/data/chroma_cogni
      - ./backend/data/btec-bus:/app/btec_corpus:ro
      - whisper_model_cache:/root/.cache/huggingface

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      local_tts_1:
        condition: service_healthy
      local_tts_2:
        condition: service_healthy

    restart: always

    # slim image had no curl; CMD form avoids shell quoting issues. Whisper pre-warm can delay bind.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s

  # Standalone kinematic WebSocket (avatar_brain.py). Inside container listens on 8001; host maps 8011→8001 (8001 is often taken on Windows/WSL).
  # Browser: ws://127.0.0.1:8011 — not ws://avatar_brain (that name is only container-to-container).
  avatar_brain:
    build: ./backend
    container_name: eduverse_avatar_brain
    working_dir: /app
    environment:
      AVATAR_BRAIN_HOST: "0.0.0.0"
      AVATAR_BRAIN_PORT: "8001"
      PYTHONUNBUFFERED: "1"
    ports:
      - "8011:8001"
    command: ["python", "avatar_brain.py"]
    restart: always
    healthcheck:
      # Full WS handshake — raw TCP probes close before HTTP line and trigger websockets EOFError noise.
      test: ["CMD", "python", "/app/avatar_brain_healthcheck.py"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      target: dev-base
    container_name: eduverse_frontend
    working_dir: /app

    volumes:
      # Full tree for hot reload in dev.
      - ${PROJECT_ROOT:-.}/frontend:/app
      # Forensic outputs from POST /api/diagnostics/analyzer → process.cwd()/logs (see frontend/src/app/api/diagnostics/analyzer/route.ts).
      # Explicit bind so reports survive container recreation and always mirror ./frontend/logs on the host.
      - ${PROJECT_ROOT:-.}/frontend/logs:/app/logs
      - /app/node_modules
      - frontend_next_cache:/app/.next

    command: ["npm", "run", "dev"]

    environment:
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"

      # Browser on host: 127.0.0.1 reaches published port 8000. Override with NEXT_PUBLIC_WS_URL if needed.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://127.0.0.1:8000/ws/agent}
      NEXT_PUBLIC_AGENT_WS: ${NEXT_PUBLIC_AGENT_WS:-ws://127.0.0.1:8000/ws/agent}

      # Guest WS + TTS without browser JWT (must match backend COGNI_DEV_BYPASS_AUTH + COGNI_WS_ALLOW_ANONYMOUS).
      NEXT_PUBLIC_COGNI_WS_ALLOW_ANONYMOUS: "true"
      # Legacy alias — code accepts both:
      NEXT_PUBLIC_COGNI_WS_GUEST_OK: "true"

      # Next.js BFF: allow POST /api/tts-with-timing with no Bearer; forwards to backend without Authorization.
      COGNI_BFF_DEV_BYPASS_AUTH: "true"

      BACKEND_URL: http://backend:8000
      TTS_BACKEND_URL: http://backend:8000/api/v1/tts-with-timing
      TTS_PROXY_TIMEOUT_MS: "90000"

      CHAT_BACKEND_URL: http://backend:8000/api/v1/chat

      # false = real TTS (speakWithTTS → /api/tts-with-timing). true = gesture-only timing, NO audio (dev/testing).
      NEXT_PUBLIC_MIME_MODE: "false"
      NEXT_PUBLIC_AVATAR_VRM_URL: "/models/195_Uta01/cogni.vrm"
      NEXT_PUBLIC_ACTIVE_ENV: ${NEXT_PUBLIC_ACTIVE_ENV:-OFFICE}

      # Browser on host: published avatar_brain port (compose maps host 8011 → container 8001). SSR does not open this socket.
      NEXT_PUBLIC_GENERATIVE_GESTURE_WS: ${NEXT_PUBLIC_GENERATIVE_GESTURE_WS:-ws://127.0.0.1:8011}

      # REST-only avatar audio: do not play WS speech_data MP3 (Piper/Edge); AgentDirector uses /api/tts-with-timing.
      NEXT_PUBLIC_USE_WS_AGENT_AUDIO: "false"

    ports:
      - "3000:3000"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').request('http://127.0.0.1:3000/api/health',{method:'HEAD'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1)).end()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  chromadb:
    profiles: ["chroma"]
    image: chromadb/chroma:latest
    container_name: eduverse_chromadb
    # Host 8010: optional Chroma; avatar_brain kinematic WS uses host 8011 in compose.
    ports:
      - "8010:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
    restart: unless-stopped

  btec-ingest:
    profiles: ["ingest"]
    build: ./backend
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - chroma_cogni_data:/app/data/chroma_cogni
      - ./backend/data/btec-bus:/app/btec_corpus:ro
    command: ["python", "scripts/btec_ingest.py", "--data-dir", "/app/btec_corpus", "--chroma-dir", "/app/data/chroma_cogni"]

volumes:
  pg_data:
  redis_data:
  chroma_cogni_data:
  chromadb_data:
  whisper_model_cache:
  frontend_next_cache:
