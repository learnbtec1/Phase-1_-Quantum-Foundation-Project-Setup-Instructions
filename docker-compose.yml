services:
  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  db:
    image: postgres:16-alpine
    container_name: nexus_db
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "5432:5432"
    volumes:
      - ./backend/data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      args:
        WITH_HABIBI_TTS: "1"
    container_name: nexus_backend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql+psycopg2://nexus:nexus@db:5432/nexus
      REDIS_URL: redis://redis:6379/0
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
      # 🚨 تم تفويض السيادة لملف .env بدلاً من القيم الثابتة
      TTS_PROVIDER: ${TTS_PROVIDER}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION}
      TTS_ALLOW_GTTS_ARABIC_FALLBACK: ${TTS_ALLOW_GTTS_ARABIC_FALLBACK}
      TTS_DISABLE_NON_AZURE_FALLBACK: ${TTS_DISABLE_NON_AZURE_FALLBACK}
      TTS_FALLBACK_ALLOW_DEV: ${TTS_FALLBACK_ALLOW_DEV:-false}
      TTS_DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-ar-JO-TaimNeural}
      LOCAL_RAG_ENABLED: "true"
      LOCAL_RAG_DIR: "/app/btec_corpus"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/data/btec-bus:/app/btec_corpus:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; u='http://127.0.0.1:8000/api/health'; req=urllib.request.Request(u, method='GET'); urllib.request.urlopen(req, timeout=3); sys.exit(0)",
        ]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      target: dev-base
    container_name: nexus_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_API_BASE: http://localhost:8000   # TTS_HEALTH_URL / TTS_SPEAK_URL in avatar.ts
      NEXT_PUBLIC_AGENT_WS: ws://localhost:8000/ws/agent
      BACKEND_URL: http://backend:8000
      TTS_BACKEND_URL: http://backend:8000/api/v1/tts-with-timing
      CHAT_BACKEND_URL: http://backend:8000/api/v1/chat
      TTS_PROXY_TIMEOUT_MS: "90000"
      # ------------------------------------------------------------
      # Rug walk plane raising (meters).
      # logical floor = (carpet AABB max.y) + NEXT_PUBLIC_RUG_WALK_SURFACE_Y_EXTRA
      # Calibration (dev):
      #   1) افتح الصفحة (dev) وشغّل snippet القياس من كونسول المتصفح (انظر أدناه).
      #   2) خذ avg_m → احسب suggest_extra_m = max(0, avg_m - 0.015).
      #   3) فعّل السطر التالي بقيمة suggest_extra_m.
      #   4) docker compose up -d --build frontend   (Next يقرأ NEXT_PUBLIC_* وقت build).
      #
      # مثال أولي شائع: 0.06 (ثم غيّرها بخطوات ±0.01 حتى تصبح فجوة القدم 0–2 سم).
      # - NEXT_PUBLIC_RUG_WALK_SURFACE_Y_EXTRA=0.06
      # ------------------------------------------------------------
      # 🚨 تم تفعيل مفاتيح الجاذبية وربطها بملف .env
      NEXT_PUBLIC_RUG_WALK_SURFACE_Y_EXTRA: ${NEXT_PUBLIC_RUG_WALK_SURFACE_Y_EXTRA}
      NEXT_PUBLIC_AVATAR_STAND_Y_OFFSET: ${NEXT_PUBLIC_AVATAR_STAND_Y_OFFSET}
    depends_on:
      backend:
        condition: service_healthy
    command: ["sh", "-c", "[ -f node_modules/next/package.json ] || npm ci; npm run dev"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 90s
    restart: unless-stopped

volumes:
  frontend_node_modules: