services:
  redis:
    image: redis:7-alpine
    container_name: eduverse_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  db:
    image: postgres:16-alpine
    container_name: eduverse_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduverse}
      POSTGRES_USER: ${POSTGRES_USER:-eduverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduverse}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    container_name: eduverse_backend
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      ANONYMIZED_TELEMETRY: "False"

      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-eduverse}:${POSTGRES_PASSWORD:-eduverse}@db:5432/${POSTGRES_DB:-eduverse}
      REDIS_URL: redis://redis:6379/0

      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}

      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"

      SSL_CERT_FILE: "/etc/ssl/certs/ca-certificates.crt"
      SSL_CERT_DIR: "/etc/ssl/certs"

      TTS_ARABIC_VOICE: "ar-JO-TaimNeural"
      COGNI_ARABIC_TTS_VOICE_LOCKED: "ar-JO-TaimNeural"

      TTS_AZURE_ONLY: "false"
      TTS_DISABLE_NON_AZURE_FALLBACK: "true"
      TTS_PROVIDER: "edge"
      EDGE_TTS_VOICE: "ar-JO-TaimNeural"

      COGNI_WS_ALLOW_ANONYMOUS: "true"
      # Docker demo: TTS + optional WS without real login (pair with frontend COGNI_BFF_DEV_BYPASS_AUTH).
      COGNI_DEV_BYPASS_AUTH: "true"

      LOCAL_RAG_ENABLED: "true"
      LOCAL_RAG_DIR: "/app/btec_corpus"

      USE_DB: "true"

    # Publish API + WebSocket to host (browser uses 127.0.0.1:8000, not Docker service name).
    ports:
      - "0.0.0.0:8000:8000"

    volumes:
      - chroma_cogni_data:/app/data/chroma_cogni
      - ./backend/data/btec-bus:/app/btec_corpus:ro
      - whisper_model_cache:/root/.cache/huggingface

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

    # slim image had no curl; CMD form avoids shell quoting issues. Whisper pre-warm can delay bind.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      target: dev-base
    container_name: eduverse_frontend
    working_dir: /app

    volumes:
      - ${PROJECT_ROOT:-.}/frontend:/app
      - /app/node_modules
      - frontend_next_cache:/app/.next

    command: ["npm", "run", "dev"]

    environment:
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"

      # Browser on host: use 127.0.0.1 (avoids localhost → IPv6 ::1 vs IPv4-only bind).
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_AGENT_WS: ws://127.0.0.1:8000/ws/agent

      # Guest WS + TTS without browser JWT (must match backend COGNI_DEV_BYPASS_AUTH + COGNI_WS_ALLOW_ANONYMOUS).
      NEXT_PUBLIC_COGNI_WS_ALLOW_ANONYMOUS: "true"
      # Legacy alias — code accepts both:
      NEXT_PUBLIC_COGNI_WS_GUEST_OK: "true"

      # Next.js BFF: allow POST /api/tts-with-timing with no Bearer; forwards to backend without Authorization.
      COGNI_BFF_DEV_BYPASS_AUTH: "true"

      BACKEND_URL: http://backend:8000
      TTS_BACKEND_URL: http://backend:8000/api/v1/tts-with-timing
      TTS_PROXY_TIMEOUT_MS: "90000"

      CHAT_BACKEND_URL: http://backend:8000/api/v1/chat

      # false = real TTS (speakWithTTS → /api/tts-with-timing). true = gesture-only timing, NO audio (dev/testing).
      NEXT_PUBLIC_MIME_MODE: "false"
      NEXT_PUBLIC_AVATAR_VRM_URL: "/models/195_Uta01/cogni.vrm"
      NEXT_PUBLIC_ACTIVE_ENV: ${NEXT_PUBLIC_ACTIVE_ENV:-OFFICE}

    ports:
      - "3000:3000"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').request('http://127.0.0.1:3000/api/health',{method:'HEAD'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1)).end()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  chromadb:
    profiles: ["chroma"]
    image: chromadb/chroma:latest
    container_name: eduverse_chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
    restart: unless-stopped

  btec-ingest:
    profiles: ["ingest"]
    build: ./backend
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - chroma_cogni_data:/app/data/chroma_cogni
      - ./backend/data/btec-bus:/app/btec_corpus:ro
    command: ["python", "scripts/btec_ingest.py", "--data-dir", "/app/btec_corpus", "--chroma-dir", "/app/data/chroma_cogni"]

volumes:
  pg_data:
  redis_data:
  chroma_cogni_data:
  chromadb_data:
  whisper_model_cache:
  frontend_next_cache:
