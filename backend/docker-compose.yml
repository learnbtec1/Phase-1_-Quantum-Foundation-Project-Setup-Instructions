# Minimal stack: API + Postgres (pgvector) + Redis.
# Use from this directory:  cd backend && docker compose up -d --build
# For the full app (frontend, backups, etc.) use the repo-root docker-compose.yml instead.
# Compose V2: no top-level `version` key (obsolete).
#
# --- HTTPS (VPS go-live, optional) ---
# 1) Point api.yourdomain.com (A record) to this server; open 80 + 443 in the firewall.
# 2) Set CADDY_DOMAIN=api.yourdomain.com in backend/.env (used only when Caddy runs).
# 3) Start with:  docker compose --profile caddy up -d --build
#    Caddy reverse-proxies to `api:8000` and obtains/renews Let’s Encrypt certs (stored in caddy_data).
# 4) Vercel: NEXT_PUBLIC_API_URL=https://api.yourdomain.com  (origin only, no /api/v1)
# 5) Backend .env: AUTH_COOKIE_SECURE=True, FRONTEND_URL/BACKEND_PUBLIC_URL/CORS to match production URLs.
# Without --profile caddy, only db + redis + api run (e.g. local dev on :8000).

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: eduverse_db
    restart: always
    environment:
      POSTGRES_USER: eduverse_user
      POSTGRES_PASSWORD: eduverse_password_secure_123
      POSTGRES_DB: eduverse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: eduverse_redis
    restart: always
    # Host 6380 → container 6379: avoids clash when eduvor-redis (root compose) binds :6379.
    # App still uses redis://redis:6379 inside the Compose network.
    ports:
      - "6380:6379"

  api:
    build: .
    container_name: eduverse_api
    restart: always
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://eduverse_user:eduverse_password_secure_123@db:5432/eduverse_db
      # app.core.config loads ASSESSMENT_REDIS_URL and aliases REDIS_URL
      ASSESSMENT_REDIS_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      AUTH_COOKIE_SECURE: "true"
    env_file:
      - .env

  # Optional TLS termination + automatic Let's Encrypt. Does not start unless: --profile caddy
  caddy:
    image: caddy:2-alpine
    container_name: eduverse_caddy
    restart: always
    profiles: ["caddy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
    # Set CADDY_DOMAIN=api.yourdomain.com in .env for Let’s Encrypt (public DNS A record must point here first).
    command:
      - caddy
      - reverse-proxy
      - --from
      - ${CADDY_DOMAIN:-localhost}
      - --to
      - api:8000
    depends_on:
      - api

volumes:
  postgres_data:
  caddy_data:
