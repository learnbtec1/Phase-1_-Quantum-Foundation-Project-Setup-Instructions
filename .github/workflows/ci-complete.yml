# Full gate: frontend unit+integration, backend pytest, Playwright E2E — then optional deploy.
# Run manually from Actions → "CI complete (gate + optional deploy)" so it does not duplicate
# per-path workflows (frontend-unit.yml, e2e.yml, backend-tests.yml) on every push.
#
# Branch protection: require this workflow + green jobs before merge, or rely on the split workflows.
name: CI complete (gate + optional deploy)
on:
  workflow_dispatch:
    inputs:
      run_deploy:
        description: After all jobs succeed, run the deploy placeholder (configure secrets + steps first)
        type: boolean
        default: false

concurrency:
  group: ci-complete-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend unit + integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run type-check

  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -m "not e2e" --tb=short -q

  e2e:
    name: Playwright E2E (Chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run type-check
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_AGENT_WS: ws://localhost:8000/ws/agent
      - run: npx playwright test --project=chromium
        env:
          CI: true

  deploy:
    name: Deploy (only after green tests)
    needs: [frontend, backend, e2e]
    if: success() && inputs.run_deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy placeholder
        run: |
          echo "All tests passed. Replace this step with your provider (Vercel, Azure, etc.)."
          echo "Use GitHub Environments + secrets; production should not deploy on failed needs.*"
