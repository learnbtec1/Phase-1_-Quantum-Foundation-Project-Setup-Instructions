# Fast unit tests (Node test runner + tsx). Runs on frontend changes; fails the job if any test fails.
# E2E (Playwright) is separate — see e2e.yml. Production deploy gates depend on your hosting provider.
name: Frontend unit tests
on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-unit.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-unit.yml'

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit + integration tests (Node; see frontend/TESTING.md)
        run: npm run test:ci
